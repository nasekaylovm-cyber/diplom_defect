name: DAST

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  dast:
    runs-on: self-hosted
    
    steps:
    
    - name: Quick ZAP scan
      run: |
        mkdir -p reports
        docker run --rm --network host \
          -v $(pwd)/reports:/zap/wrk:rw \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://localhost:8080 \
          -J zap-report.json \
          -r zap-report.html \
          -I

    
 
