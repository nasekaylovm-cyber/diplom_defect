name: DAST

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  dast:
    runs-on: self-hosted
    
    steps:
    
    - name: Run ZAP scan
      run: |
        docker run --rm --network host \
          -v $(pwd):/reports \
          owasp/zap2docker-stable zap-baseline.py \
          -t http://localhost:8080 \
          -J -r \
          -m 5
      continue-on-error: true

    
    - name: Show results
      run: |
        echo "=== SCAN COMPLETE ==="
        ls -la *.json *.html 2>/dev/null || echo "No reports generated"
