name: DAST

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  dast:
    runs-on: [self-hosted, linux]
    
    steps:
    - name: Quick ZAP scan
      run: |
        mkdir -p reports
        docker run --rm --network host \
          -v $(pwd)/reports:/zap/wrk:rw \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://localhost:8080 \
          -I
    
    - name: Nuclei Scan
      run: |
        docker run --rm --network host \
          -v $(pwd)/security-reports:/reports \
          projectdiscovery/nuclei:latest \
          -u http://localhost:8080 \
          -severity critical,high \
          -json -o /reports/nuclei-report.json
      continue-on-error: true
    
    - name: Security Gate
      run: |
        echo "🔒 Security Check Results:"
        
        # Check ZAP results
        if [ -f security-reports/zap-report.json ]; then
          ZAP_HIGH=$(jq '[.site[]?.alerts[]? | select(.risk == "High")] | length' security-reports/zap-report.json 2>/dev/null || echo "0")
          if [ "$ZAP_HIGH" -gt 0 ]; then
            echo "❌ ZAP found $ZAP_HIGH high-risk issues"
            exit 1
          fi
        fi
        
        # Check Nuclei results  
        if [ -f security-reports/nuclei-report.json ]; then
          NUCLEI_CRITICAL=$(grep -c '"severity":"critical"' security-reports/nuclei-report.json 2>/dev/null || echo "0")
          if [ "$NUCLEI_CRITICAL" -gt 0 ]; then
            echo "❌ Nuclei found $NUCLEI_CRITICAL critical issues"
            exit 1
          fi
        fi
        
        echo "✅ No critical security issues found"
    
    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports-${{ github.sha }}
        path: security-reports/
    
    - name: Create Security Summary
      uses: actions/github-script@v6
      if: always()
      with:
        script: |
          const summary = `
          ## 🛡️ DAST Security Scan Complete
          
          **Scan Target**: http://localhost:8080
          **Status**: ${{ job.status }}
          **Reports**: Available in artifacts
          
          [View Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
