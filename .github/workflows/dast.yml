name: DAST

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  dast:
    runs-on: self-hosted
    
    steps:
    - name: Quick ZAP scan
      run: |
        mkdir -p reports
        docker run --rm --network host \
          -v $(pwd)/reports:/zap/wrk:rw \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://localhost:8080 \
          -J zap-report.json \
          -r zap-report.html \
          -m 3 \
          -I

    - name: Check scan results
      run: |
        echo "📊 Scan results analysis..."
        if [ -f zap-reports/zap-report.json ]; then
          HIGH_COUNT=$(jq '[.site[]?.alerts[]? | select(.risk == "High")] | length' zap-reports/zap-report.json 2>/dev/null || echo "0")
          MEDIUM_COUNT=$(jq '[.site[]?.alerts[]? | select(.risk == "Medium")] | length' zap-reports/zap-report.json 2>/dev/null || echo "0")
          LOW_COUNT=$(jq '[.site[]?.alerts[]? | select(.risk == "Low")] | length' zap-reports/zap-report.json 2>/dev/null || echo "0")
          
          echo "ZAP Findings:"
          echo "  High risk: $HIGH_COUNT"
          echo "  Medium risk: $MEDIUM_COUNT" 
          echo "  Low risk: $LOW_COUNT"
          
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "❌ Security gate blocked: $HIGH_COUNT high-risk issues found"
            exit 1
          else
            echo "✅ No high-risk security issues found"
          fi
        else
          echo "⚠️ ZAP report not generated, but scan completed"
        fi
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: dast-reports-${{ github.sha }}
        path: zap-reports/
        if-no-files-found: ignore
        retention-days: 30
    
    - name: Create security summary
      if: always()
      run: |
        echo "## 🛡️ DAST Security Scan Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Target**: http://localhost:8080" >> $GITHUB_STEP_SUMMARY
        echo "**Scan Date**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f zap-reports/zap-report.json ]; then
          HIGH_COUNT=$(jq '[.site[]?.alerts[]? | select(.risk == "High")] | length' zap-reports/zap-report.json 2>/dev/null || echo "0")
          MEDIUM_COUNT=$(jq '[.site[]?.alerts[]? | select(.risk == "Medium")] | length' zap-reports/zap-report.json 2>/dev/null || echo "0")
          
          echo "### Security Findings:" >> $GITHUB_STEP_SUMMARY
          echo "- **High Risk**: $HIGH_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Medium Risk**: $MEDIUM_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "### 🚨 Security Gate Blocked" >> $GITHUB_STEP_SUMMARY
            echo "Deployment blocked due to high-risk security issues" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Security Gate Passed" >> $GITHUB_STEP_SUMMARY
            echo "No critical security issues found" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "### 📋 Scan Completed" >> $GITHUB_STEP_SUMMARY
          echo "ZAP security scan executed successfully" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*Automated security scan by GitHub Actions*" >> $GITHUB_STEP_SUMMARY
    
    - name: Security Gate
      run: |
        echo "🔒 Security Check Results:"
        
        if [ -f security-reports/zap-report.json ]; then
          ZAP_HIGH=$(jq '[.site[]?.alerts[]? | select(.risk == "High")] | length' security-reports/zap-report.json 2>/dev/null || echo "0")
          echo "ZAP High Risk: $ZAP_HIGH"
          
          if [ "$ZAP_HIGH" -gt 0 ]; then
            echo "❌ ZAP found $ZAP_HIGH high-risk issues"
            exit 1
          fi
        fi
        
        echo "✅ No critical security issues found"
    
    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports-${{ github.sha }}
        path: security-reports/
    
    - name: Create Security Summary
      if: always()
      run: |
        echo "## 🛡️ DAST Security Scan" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Target**: http://localhost:8080" >> $GITHUB_STEP_SUMMARY
        echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f security-reports/zap-report.json ]; then
          ZAP_HIGH=$(jq '[.site[]?.alerts[]? | select(.risk == "High")] | length' security-reports/zap-report.json 2>/dev/null || echo "0")
          ZAP_MEDIUM=$(jq '[.site[]?.alerts[]? | select(.risk == "Medium")] | length' security-reports/zap-report.json 2>/dev/null || echo "0")
          echo "**ZAP Results**: High: $ZAP_HIGH, Medium: $ZAP_MEDIUM" >> $GITHUB_STEP_SUMMARY
        else
          echo "**ZAP Results**: No report generated" >> $GITHUB_STEP_SUMMARY
        fi
