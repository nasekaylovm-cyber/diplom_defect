name: Django CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: defectdojo_test
          POSTGRES_USER: defectdojo
          POSTGRES_PASSWORD: defectdojo
        ports: [5432:5432]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Wait for PostgreSQL
      run: until pg_isready -h localhost; do sleep 5; done
      
    - name: Run tests
      run: python manage.py test --noinput
      env:
        DATABASE_URL: postgresql://defectdojo:defectdojo@localhost:5432/defectdojo_test
        DD_SECRET_KEY: "test-key-$(date +%s)"

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
