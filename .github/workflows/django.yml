name: Django CI Nas

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: defectdojo_test
          POSTGRES_USER: defectdojo
          POSTGRES_PASSWORD: defectdojo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
        
    - name: Install Python dependencies
      run: pip install -r requirements.txt
      
    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U defectdojo; do
          echo "Waiting for PostgreSQL..."
          sleep 5
        done
        echo "PostgreSQL is ready!"
      
    - name: Run tests
      run: |
        echo "=== Looking for test directories ==="
        find . -type d -name "*test*" | grep -v __pycache__ | head -10
        
        echo "=== Running discovered tests ==="
        
        if [ -d "dojo/test" ]; then
          python -m pytest dojo/test --junitxml=test-results.xml --tb=short -v || true
        elif [ -d "dojo/tests" ]; then
          python -m pytest dojo/tests --junitxml=test-results.xml --tb=short -v || true
        else
          python -m pytest . --junitxml=test-results.xml --tb=short -v || true
        fi
      env:
        DATABASE_URL: postgresql://defectdojo:defectdojo@localhost:5432/defectdojo_test
        DD_SECRET_KEY: "test-key-$(date +%s)"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          **/test*.log
          **/test*.xml


  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: trivy-results.sarif
  
  report:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: always()
    
    steps:
    - name: Create summary
      run: |
        echo "## CI/CD Results" >> $GITHUB_STEP_SUMMARY
        echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
        
    - name: Create issue on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'CI Failed for ${{ github.sha }}',
            body: 'Tests or security scan failed. Check the workflow run.'
          })
