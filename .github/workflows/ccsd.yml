name: CD-Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  
  deploy:
    name: Deploy to Server
    runs-on: self-hosted      
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy DefectDojo
      run: |
        cd /opt
        sudo rm -rf django-DefectDojo
        sudo git clone https://github.com/DefectDojo/django-DefectDojo
        cd django-DefectDojo
        
        sudo chmod +x ./docker/docker-compose-check.sh
        sudo ./docker/docker-compose-check.sh
        
        sudo docker compose build --no-cache
        sudo docker-compose up -d
        
        sudo docker compose logs initializer | grep -i "admin"
